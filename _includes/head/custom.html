<!-- Set theme before CSS paints; system is the default. -->
<script>
(function () {
  var preference = "system";
  try { preference = localStorage.getItem("site-theme") || "system"; } catch (e) {}
  var dark = preference === "dark" || (preference === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.colorScheme = dark ? "dark" : "light";
})();
</script>

<!-- Visualize LaTeX chars properly -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
  if (document.querySelector('.math, .latex, [class*="math"]')) {
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']]
      }
    };
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js';
    script.async = true;
    script.onerror = function() {
      console.error("Failed to load MathJax from CDN.");
    };
    document.head.appendChild(script);
  }
});
</script>
